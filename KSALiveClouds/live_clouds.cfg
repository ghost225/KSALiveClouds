# KSALiveClouds settings. Delete a line to get its default.

# false = KSA's stock clouds, nothing fetched
enabled = true

# GMGSI publishes one mosaic an hour (~35 min after the hour): only look for a newer one once the data is
# older than this + 35 min. Applies at launch and to the in-game refresh.
refresh_minutes = 60

# How long KSA's loading screen may wait for the download + build (normally ~5 s) before falling back.
timeout_seconds = 45

# When the fetch fails: "cache" = last snapshot (if younger than max_cache_age_hours), "stock" = KSA's clouds
offline = cache
max_cache_age_hours = 72

# Hold the cloud layers still so real weather stays over real places (stock clouds slide ~1 turn per 23 game days).
freeze_rotation = true

# During play: look for a newer mosaic every check_minutes (downloads only once one is due, ~hourly) and
# crossfade to it over fade_minutes of wall-clock time, one texture upload every fade_step_seconds.
live_refresh = true
check_minutes = 10
fade_minutes = 10
fade_step_seconds = 30

# While time-warping the (otherwise frozen) layers drift at the stock wind speed with game time; when the warp
# ends they ease back over the real weather positions in warp_ease_seconds.
warp_drift = true
warp_ease_seconds = 8

# Small-scale texture borrowed from the stock map at cloud edges (0 = smooth satellite pixels, ~8 km).
detail = 0.45

# Also replace the high cirrus layer (11 km) from the coldest cloud tops.
top_layer = true

# 4096 matches stock VRAM use; 2048 uses a quarter and is still finer than the data.
face_size = 4096

# Cloud types: replace KSA's stratus/cumulus selector (stock = random noise) with one from the satellite.
# type_from_data = share of satellite vs stock noise; lumpy_low/high = IR texture (counts) where it leans
# cumulus; deep_start_k/full_k = cloud tops this cold are convective towers (cumulus, and full base cloud).
type_map = true
type_from_data = 0.75
lumpy_low = 4
lumpy_high = 12
deep_start_k = 212
deep_full_k = 202

# Under high cloud the 2 km layer keeps only this share of its coverage (except under deep convection), so
# cirrus over clear ground no longer draws a low deck too.
base_under_cirrus = 0.35

# Tuning: counts colder than the local clear sky where cloud starts / is solid (~0.5 K per count).
cloud_start = 10
cloud_full = 42
# Cirrus layer: cloud-top temperature (K) where it starts / is solid.
cirrus_start_k = 238
cirrus_full_k = 218
